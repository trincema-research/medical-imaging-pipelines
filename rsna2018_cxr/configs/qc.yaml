# Thresholds used by iteration 1. QcThresholds and SilverRule use these same defaults.
# This file is a record. The segmenter does not read it at runtime.
silver_accept:
  mean_pairwise_dice: 0.97
  min_pairwise_dice: 0.95
  anatomy_qc_required: true
  max_relative_area_disagreement: 0.05
  left_right_valid: true
anatomy:
  min_lung_area_fraction: 0.08
  max_lung_area_fraction: 0.80
  hard_max_lung_area_fraction: 0.95
  max_overlap_fraction: 0.05
  warning_asymmetry_ratio: 3.5
  hard_asymmetry_ratio: 8.0
  # When a reference set exists, replace the area band with P1-P99 (soft) and P0.1-P99.9 (hard).
  percentile_soft: [1, 99]
  percentile_hard: [0.1, 99.9]
