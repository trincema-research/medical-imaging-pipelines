[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-imaging-pipelines"
version = "0.1.0"
description = "RSNA medical imaging pipelines (2018 CXR, 2024 lumbar, 2025 brain, 2026 knee)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "pydicom>=2.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-learn>=1.3"]
kaggle = ["kaggle>=1.6"]
nas = ["torch>=2.1", "torchvision>=0.16"]
perf_pipeline = ["torch>=2.1", "torchvision>=0.16", "scikit-learn>=1.3"]
ordinal = ["torch>=2.1", "torchvision>=0.16", "scikit-learn>=1.3"]

[project.scripts]
rsna2024-export-crops = "rsna2024_lumbar.preprocessing.cli:main"
rsna2024-download-raw = "rsna2024_lumbar.data.download:main"
rsna2024-unzip-raw = "rsna2024_lumbar.data.unzip:main"
rsna2024-validate-raw = "rsna2024_lumbar.data.validate:main"
rsna2024-nas = "rsna2024_lumbar.nas.cli:main"
rsna2024-nas-launch = "rsna2024_lumbar.nas.launch:main"
rsna2024-nas-pack = "rsna2024_lumbar.nas.pack:main"
rsna2024-nas-deploy = "rsna2024_lumbar.nas.deploy:main"
rsna2024-nas-best = "rsna2024_lumbar.nas.best:main"
rsna2024-nas-summarize = "rsna2024_lumbar.nas.summarize:main"
rsna2024-nas-export-compact = "rsna2024_lumbar.nas.export_compact:main"
rsna2024-perf-pipeline = "rsna2024_lumbar.perf_pipeline.cli:main"
rsna2024-perf-pipeline-pack = "rsna2024_lumbar.perf_pipeline.pack_cloud:main"
rsna2024-perf-pipeline-unpack = "rsna2024_lumbar.perf_pipeline.unpack_cloud:main"
rsna2024-perf-pipeline-deploy = "rsna2024_lumbar.perf_pipeline.deploy_cloud:main"
rsna2024-ordinal = "rsna2024_lumbar.perf_pipeline.cli:main"

[tool.setuptools.package-data]
"rsna2024_lumbar.nas" = ["configs/*.json"]

[tool.setuptools.packages.find]
include = ["common*", "rsna2024_lumbar*"]
exclude = ["rsna2024_lumbar.tests*"]

[tool.pytest.ini_options]
testpaths = ["rsna2024_lumbar/tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "local: needs a local dump (processed cache / Kaggle); skipped in GitHub Actions",
]
